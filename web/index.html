<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>latent-db mini semantic search (wasm)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; }
  #status { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
  form { display: flex; gap: 0.5rem; }
  input[type=text] { flex: 1; padding: 0.5rem; font-size: 1rem; }
  button { padding: 0.5rem 1rem; font-size: 1rem; }
  ul { list-style: none; padding: 0; }
  li { padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; margin: 0.4rem 0; }
  .score { color: #888; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>latent-db mini semantic search</h1>
<p id="status">Loading wasm module + corpus.bin...</p>
<form id="query-form">
  <input id="query-input" type="text" placeholder="Ask about cooking, astronomy, or finance..." disabled />
  <button type="submit" disabled>Search</button>
</form>
<ul id="results"></ul>

<script type="module">
import init, { WasmLatentDb } from "./pkg/latent_db.js";

const EMBED_SERVER = "http://localhost:8787/embed";

const statusEl = document.getElementById("status");
const form = document.getElementById("query-form");
const input = document.getElementById("query-input");
const button = form.querySelector("button");
const resultsEl = document.getElementById("results");

let db;

async function embedQuery(text) {
  const resp = await fetch(EMBED_SERVER, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  if (!resp.ok) throw new Error(`embed_server returned ${resp.status}`);
  const { embedding } = await resp.json();
  return embedding;
}

async function main() {
  await init();
  const bytes = new Uint8Array(await (await fetch("./corpus.bin")).arrayBuffer());
  db = WasmLatentDb.fromBytes(bytes);
  statusEl.textContent =
    `Ready -- ${db.len()} documents indexed (dim=${db.dim()}). ` +
    `Live query embedding via ${EMBED_SERVER} (run: cargo run --release --example embed_server)`;
  input.disabled = false;
  button.disabled = false;
  input.focus();
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = input.value.trim();
  if (!query || !db) return;

  button.disabled = true;
  resultsEl.innerHTML = "<li>Searching...</li>";
  try {
    const embedding = await embedQuery(query);
    const hitsJson = db.search(Float32Array.from(embedding), 3, db.len());
    const hits = JSON.parse(hitsJson);

    resultsEl.innerHTML = "";
    if (hits.length === 0) {
      resultsEl.innerHTML = "<li>No results.</li>";
    }
    for (const hit of hits) {
      const li = document.createElement("li");
      li.innerHTML = `<div class="score">score=${hit.score.toFixed(4)}</div>${hit.metadata}`;
      resultsEl.appendChild(li);
    }
  } catch (err) {
    resultsEl.innerHTML = `<li>Error: ${err.message} -- is embed_server running on :8787?</li>`;
  } finally {
    button.disabled = false;
  }
});

main().catch((err) => {
  statusEl.textContent = `Failed to load: ${err.message}`;
});
</script>
</body>
</html>
