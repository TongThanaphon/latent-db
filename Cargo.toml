[package]
name = "latent-db"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# rlib: normal native usage (examples, tests, downstream Rust crates).
# cdylib: required by wasm-bindgen/wasm-pack to produce a loadable .wasm.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1"
blake3 = "1"
wasm-bindgen = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }
anyhow = { version = "1.0.104", optional = true }

[features]
wasm = ["dep:wasm-bindgen", "dep:serde_json"]
# `latentdb-cli` binary (see src/bin/latentdb-cli/main.rs): kept behind its
# own feature, distinct from `wasm`, so the wasm32-unknown-unknown cdylib
# build never has to compile tokio/axum (neither meaningfully supports that
# target). These are declared again here, separately from the equivalent
# entries under [dev-dependencies] (which examples/embed_server.rs etc. use
# unconditionally) because dev-dependencies aren't visible to a `[[bin]]`
# target -- only to examples/tests/benches.
cli = ["dep:clap", "dep:axum", "dep:tokio", "dep:anyhow", "dep:serde_json"]

# rand/rand_core pull in getrandom transitively for OS-entropy seeding paths
# (StdRng::from_entropy(), thread_rng(), ...) that this crate never actually
# calls -- every RNG here is seeded deterministically via seed_from_u64. But
# getrandom still needs a backend picked for wasm32-unknown-unknown at
# compile time, or the build fails outright. "js" makes it use the browser's
# crypto API if that dead code path is ever hit; on native targets this
# dependency/feature is simply unused.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[[example]]
name = "demo"
path = "examples/demo.rs"

# test = true: examples default to `test = false` (plain `cargo test` won't
# build or run them), but this one carries `#[cfg(test)] mod tests` covering
# its network-free logic (sentence/chunk splitting, paragraph extraction,
# Corpus key stability) -- opt in so the repo's pre-commit hook (`cargo
# test`, unqualified) actually exercises them instead of leaving them as
# manual-run-only via `cargo test --example url_rag_server`.
[[example]]
name = "url_rag_server"
path = "examples/url_rag_server.rs"
test = true

[[bin]]
name = "latentdb-cli"
path = "src/bin/latentdb-cli/main.rs"
required-features = ["cli"]

# harness = false: hand-rolled std::time::Instant timers, no criterion dev-dep
# (matches katgpt-rs's own bench convention -- see benches/support.rs).
[[bench]]
name = "search_bench"
path = "benches/search_bench.rs"
harness = false

[[bench]]
name = "merkle_proof_bench"
path = "benches/merkle_proof_bench.rs"
harness = false

[[bench]]
name = "viable_graph_bench"
path = "benches/viable_graph_bench.rs"
harness = false

[[bench]]
name = "projector_bench"
path = "benches/projector_bench.rs"
harness = false

[[bench]]
name = "euclidean_kernel_bench"
path = "benches/euclidean_kernel_bench.rs"
harness = false

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[dev-dependencies]
anyhow = "1.0.104"
axum = "0.8"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
hf-hub = { version = "1.0.0", features = ["blocking"] }
scraper = "0.27.0"
serde_json = "1.0.151"
tokenizers = "0.23.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
ureq = "3.3.0"
